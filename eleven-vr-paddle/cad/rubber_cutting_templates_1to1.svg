<text x="140" y="167.8" font-family="Helvetica, Arial, sans-serif" font-size="2.8"  fill="#222222">• 1A / 2A (Blue): cut from rubber side.</text>
<text x="140" y="173.6" font-family="Helvetica, Arial, sans-serif" font-size="2.8"  fill="#222222">• 1B / 2B (Orange): trace on back sponge.</text>
<text x="140" y="179.4" font-family="Helvetica, Arial, sans-serif" font-size="2.8"  fill="#222222">• Lightly scuff PETG with 240-grit first.</text>
<text x="140" y="185.2" font-family="Helvetica, Arial, sans-serif" font-size="2.8"  fill="#222222">• Pads sit clear of dorsal rib &amp; handle.</text>
